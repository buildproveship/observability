[project]
name = "releaseready-observability"
version = "0.1.0"
description = "Local OSS Prometheus baseline and synthetic probe fixtures."
readme = "README.md"
requires-python = ">=3.12"
# Runtime is the standard library only; Prometheus and the exporter are images.
dependencies = []

[dependency-groups]
# Pinned to the versions the shared code-quality scanner uses.
dev = ["ruff==0.17.4", "mypy==2.4.1", "vulture==2.16", "pip-audit==2.9.0"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
# Keep the line length of the shared scanner, which runs ruff with its defaults.
line-length = 88

[tool.ruff.lint]
# The shared scanner's ruleset (code-quality ruff-adapter.ts) is the floor.
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "PL", "RUF", "PGH", "BLE"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["observability", "tests"]

[tool.vulture]
paths = ["observability", "tests"]
min_confidence = 80
