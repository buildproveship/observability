# Light pull request checks. Owner decision of 18 Nov 2026 (docs/decisions.md): ruff (lint and format), mypy strict,
# vulture and the unit tests run on every pull request via scripts/check.sh. The Docker runtime tests run on demand and
# nightly (runtime.yml). Jobs run on GitHub-hosted ubuntu-24.04 (owner decision of 20 Nov 2026); the self-hosted Mac runner
# only serves macOS-only nightly tests in ReleaseReady. This replaces the 12 Nov 2026 manual-only Actions decision (RRDPLAT-44).
name: Pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ["**/*.md", "docs/**"]
permissions:
  contents: read
  packages: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No setup-python: uv installs the Python in .python-version itself.
      # uv comes from PyPI at a pinned version (only GitHub-owned actions are allowed) and installs the Python in .python-version itself.
      - name: Cache uv downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
      - name: Install uv and the locked dev tools
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/python" -m pip install --disable-pip-version-check uv==0.13.6
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/uv-venv/bin/uv" sync --locked
      - name: Lint, format, types, dead code and unit tests
        run: sh scripts/check.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@releaseready"
      - name: Guardrails (static rules and jscpd)
        run: npx --yes --package @releaseready/config@^2.0.1 releaseready-guardrails
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  security:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks, trivy, semgrep and zizmor
        uses: releaseready/config/.github/actions/security-scan@0e256fb3dff2777b7a1ca31342eae322935f06d2 # v2.2.1
