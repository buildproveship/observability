# Light pull request checks. Owner decision of 18 Nov 2026 (docs/decisions.md): ruff (lint and format), mypy strict,
# vulture and the unit tests run on every pull request via scripts/check.sh. The Docker runtime tests run on demand and
# nightly (runtime.yml). Jobs run on the org self-hosted macOS arm64 runner (labels self-hosted, rr-local, 19 Nov 2026) because
# hosted minutes are exhausted. This replaces the 12 Nov 2026 manual-only Actions decision (RRDPLAT-44) for this light set only.
name: Pull request
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  packages: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, rr-local]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only GitHub-owned actions are allowed in this repository, so uv comes from PyPI at a pinned version.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv and the locked dev tools
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.6
          uv sync --locked
      - name: Lint, format, types, dead code and unit tests
        run: sh scripts/check.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@releaseready"
      - name: Guardrails (static rules and jscpd)
        run: npx --yes --package @releaseready/config@^2.0.1 releaseready-guardrails
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  security:
    if: github.event.pull_request.draft == false
    runs-on: [self-hosted, rr-local]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks, trivy, semgrep and zizmor
        uses: releaseready/config/.github/actions/security-scan@af0904fd8c082397432293c3aefe54a2f0a219dc # v2.2.0
