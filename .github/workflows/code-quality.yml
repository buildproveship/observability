# Shared code-quality scan (Jira RRDPLAT-44). Manual only: routine dev scans run
# in the ReleaseReady Dev app to save GitHub Actions minutes (owner decision,
# 12 Nov 2026). Kept as an on-demand fallback; Actions are for production
# deployment builds.
name: Quality
on: workflow_dispatch
permissions:
  contents: read
jobs:
  quality:
    uses: noisegatemusicstudio/code-quality/.github/workflows/quality-scan.yml@bffc97e3c23cbea4005a11be998338a8356d246d
    with:
      code-quality-ref: bffc97e3c23cbea4005a11be998338a8356d246d
      enforce: true
