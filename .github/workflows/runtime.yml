# Docker runtime tests. Owner decision of 18 Nov 2026 (docs/decisions.md): the tests that start the pinned Prometheus
# and the synthetic TDM listener fixture through Docker Compose run on demand and weekly, not on every pull request.
# Runs on GitHub-hosted ubuntu-24.04 (owner decision of 20 Nov 2026) with its native Docker engine.
name: Runtime tests
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0" # weekly, Monday 02:00 Hong Kong time
permissions:
  contents: read
  actions: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Scheduled runs skip when main has had no new commit since the last successful run.
      - name: Skip scheduled run when nothing changed
        id: gate
        if: github.event_name == 'schedule'
        run: |
          last="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow runtime.yml --status success --json headSha --limit 1 --jq '.[0].headSha // ""')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "::notice::No new commit on main since the last successful run ($last); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No setup-python: uv installs the Python in .python-version itself.
      # uv comes from PyPI at a pinned version (only GitHub-owned actions are allowed) and installs the Python in .python-version itself.
      - name: Cache uv downloads
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}
      - name: Install uv and the locked dev tools
        if: steps.gate.outputs.skip != 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/python" -m pip install --disable-pip-version-check uv==0.13.6
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/uv-venv/bin/uv" sync --locked
      - name: Remove leftovers from earlier runs
        if: steps.gate.outputs.skip != 'true'
        run: sh scripts/clean-docker.sh
      - name: Prometheus baseline runtime test
        if: steps.gate.outputs.skip != 'true'
        run: uv run python -m tests.runtime
      - name: TDM listener probe fixture
        if: steps.gate.outputs.skip != 'true'
        run: |
          uv run python -m tests.tdm_probe_runtime validate
          uv run python -m tests.tdm_probe_runtime test
      - name: Tear down containers, networks and volumes
        if: always() && steps.gate.outputs.skip != 'true'
        run: sh scripts/clean-docker.sh
