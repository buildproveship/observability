# Docker runtime tests. Owner decision of 18 Nov 2026 (docs/decisions.md): the tests that start the pinned Prometheus
# and the synthetic TDM listener fixture through Docker Compose run on demand and nightly, not on every pull request.
# Runs on GitHub-hosted ubuntu-24.04 (owner decision of 20 Nov 2026) with its native Docker engine.
name: Runtime tests
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 02:00 Hong Kong time
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No setup-python: uv installs the Python in .python-version itself.
      # uv comes from PyPI at a pinned version (only GitHub-owned actions are allowed) and installs the Python in .python-version itself.
      - name: Install uv and the locked dev tools
        run: |
          python3 -m venv "$RUNNER_TEMP/uv-venv"
          "$RUNNER_TEMP/uv-venv/bin/python" -m pip install --disable-pip-version-check uv==0.13.6
          echo "$RUNNER_TEMP/uv-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/uv-venv/bin/uv" sync --locked
      - name: Remove leftovers from earlier runs
        run: sh scripts/clean-docker.sh
      - name: Prometheus baseline runtime test
        run: uv run python -m tests.runtime
      - name: TDM listener probe fixture
        run: |
          uv run python -m tests.tdm_probe_runtime validate
          uv run python -m tests.tdm_probe_runtime test
      - name: Tear down containers, networks and volumes
        if: always()
        run: sh scripts/clean-docker.sh
